name: CI

on:
  push:
    branches: [main, toGPT]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: node ${{ matrix.node }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}

      - name: Build, test, pack and validate an isolated installation
        run: npm run pack

      - name: The committed bundle matches the sources
        run: git diff --exit-code lib/client.js

      - name: Upload installable bundle
        if: matrix.node == 22
        uses: actions/upload-artifact@v7
        with:
          name: dsh-workboard-package
          path: dist/
